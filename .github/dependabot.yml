version: 2
updates:
  # npm dependencies — weekly, minor+patch grouped to cut PR noise; majors stay separate.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope
  # GitHub Actions used by the workflows (CI, release-please).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
