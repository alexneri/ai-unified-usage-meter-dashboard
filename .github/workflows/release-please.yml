name: release-please

# On every push to main, release-please opens/updates a single "release" PR that rolls up
# all Conventional-Commit changes since the last release into one version bump + CHANGELOG.
# Merging that PR tags vX.Y.Z and cuts a GitHub Release. No manual tagging.
#
# NOTE: requires repo setting Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" = ON, or the release PR can't open.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
